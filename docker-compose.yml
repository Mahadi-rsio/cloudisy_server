services:
  app:
    build: .
    container_name: express_app
    env_file: .env
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - db
      - minio
      - redis
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips

  upload_worker:
    build: .
    container_name: upload_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/upload.worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips

  log_worker:
    build: .
    container_name: log_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/log.worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped

  sync_worker:
    build: .
    container_name: sync_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/sync.worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy_server
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

  minio:
    image: minio/minio
    container_name: minio_server
    env_file: .env
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server
    expose:
      - "6379"
    restart: unless-stopped

  supavisor:
    image: supabase/supavisor:2.7.4
    ports:
      - "5432:5432"
      - "6543:6543"
      - "4000:4000"
    environment:
      SECRET_KEY_BASE: "3b541285a851b9fa5e3b9e8e4b4f8e2a7c9d1f6a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8"
      VAULT_ENC_KEY: "NJr1d2tpEzJY6pH00INDQpPFjE/gbE2y"
      API_JWT_SECRET: "supersecretapikey"
      METRICS_JWT_SECRET: "supermetricssecret"
      DATABASE_URL: "ecto://postgres:postgres@db:5432/mydb"
      CLUSTER_POSTGRES: "true"
      PORT: "4000"
      PROXY_PORT_SESSION: "5432"
      PROXY_PORT_TRANSACTION: "6543"
      REGION: "local"
      ERL_AFLAGS: "-proto_dist inet_tcp"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: vector
    env_file: .env
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - caddy_logs:/var/log/caddy:ro
      - ./config/vector.toml:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    depends_on:
      - caddy
      - app
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  vector_data:
  temp_zips:
  caddy_logs:
