services:
  app:
    build:
      context: .
      target: runner
    container_name: express_app
    env_file: .env
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - cloudisy_network

  migrator:
    build:
      context: .
      target: migrator
    container_name: migrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cloudisy_network

  upload_worker:
    build:
      context: .
      target: runner
    container_name: upload_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/upload.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - cloudisy_network

  log_worker:
    build:
      context: .
      target: runner
    container_name: log_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/log.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - cloudisy_network

  sync_worker:
    build:
      context: .
      target: runner
    container_name: sync_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/sync.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - cloudisy_network

  database_worker:
    build:
      context: .
      target: runner
    container_name: database_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/database.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - cloudisy_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy_server
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  minio:
    image: minio/minio
    container_name: minio_server
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - miniodata:/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  supavisor:
    image: supabase/supavisor:2.7.4
    container_name: supavisor
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /app/bin/supavisor eval "Supavisor.Release.migrate()"
        /app/bin/supavisor start
    ports:
      - "5432:5432"
      - "6543:6543"
      - "4000:4000"
    env_file: .env
    environment:
      SECRET_KEY_BASE: ${SUPAVISOR_SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${SUPAVISOR_VAULT_ENC_KEY}
      API_JWT_SECRET: ${SUPAVISOR_API_JWT_SECRET}
      METRICS_JWT_SECRET: ${SUPAVISOR_METRICS_JWT_SECRET}
      DATABASE_URL: "ecto://postgres:postgres@db:5432/mydb"
      CLUSTER_POSTGRES: "true"
      PORT: "4000"
      PROXY_PORT_SESSION: "5432"
      PROXY_PORT_TRANSACTION: "6543"
      REGION: "local"
      ERL_AFLAGS: "-proto_dist inet_tcp"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: vector
    env_file: .env
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - caddy_logs:/var/log/caddy:ro
      - ./config/vector.toml:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    depends_on:
      caddy:
        condition: service_started
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

networks:
  cloudisy_network:
    driver: bridge
    name: cloudisy_network

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  vector_data:
  temp_zips:
  caddy_logs:
