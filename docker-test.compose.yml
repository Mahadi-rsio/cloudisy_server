version: "3.8"

services:

  supavisor:
    image: supabase/supavisor:latest
    ports:
      - "5432:5432"
      - "6543:6543"
      - "4000:4000"
    environment:
      SECRET_KEY_BASE: "3b541285a851b9fa5e3b9e8e4b4f8e2a7c9d1f6a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8"
      VAULT_ENC_KEY: "your32charencryptionkey!!!!!!!!"
      API_JWT_SECRET: "supersecretapikey"
      METRICS_JWT_SECRET: "supermetricssecret"
      DATABASE_URL: "ecto://postgres:postgres@supavisor_db:5432/supavisor"
      CLUSTER_POSTGRES: "true"
      PORT: "4000"
      PROXY_PORT_SESSION: "5432"
      PROXY_PORT_TRANSACTION: "6543"
      REGION: "local"
      ERL_AFLAGS: "-proto_dist inet_tcp"
    depends_on:
      supavisor_db:
        condition: service_healthy
    networks:
      - dbnet
    restart: unless-stopped

  supavisor_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supavisor
    volumes:
      - supavisor_db_data:/var/lib/postgresql/data
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supavisor"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # one manual test tenant DB
  pg_tenant_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tenantpass
      POSTGRES_DB: postgres
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  dbnet:
    driver: bridge
    name: dbnet

volumes:
  supavisor_db_data:
